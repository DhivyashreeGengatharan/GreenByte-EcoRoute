<!doctype html>
<html lang="en" data-theme="dark" class="dark">

<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/png" href="/logo.png" />
  <link rel="apple-touch-icon" href="/logo.png" />
  <link rel="manifest" href="/manifest.json" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#030712" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="EcoRoute" />
  <title>EcoRoute | Planetary Environmental Intelligence & Digital Twin</title>
</head>

<body class="dark" style="background-color: #030712; color: #f8fafc; margin: 0;">
  <div id="root"></div>
  <script type="module" src="/src/main.tsx"></script>
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('/sw.js').then((reg) => {
          console.log('✅ EcoRoute PWA Service Worker Registered:', reg.scope);
        }).catch((err) => {
          console.log('PWA Service Worker registration skipped:', err);
        });
      });
    }
  </script>
</body>

</html>
